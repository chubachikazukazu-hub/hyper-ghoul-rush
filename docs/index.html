<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>HYPER喰種RUSHシミュレータ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
  overflow:hidden
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column
}

#top{
  height:48px;
  flex:0 0 auto;
  display:flex;
  gap:7px;
  align-items:center;
  padding:6px 8px;
  background:#111
}

button{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:#292929;
  color:#fff;
  font-weight:800
}

button:disabled{
  opacity:.4
}

#start{
  background:#16a34a
}

#stageWrap{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000
}

#project{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden
}

#cover{
  position:absolute;
  inset:0;
  z-index:10;
  background:#050505;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px
}

#panel{
  max-width:520px
}

#title{
  font-size:22px;
  font-weight:900;
  margin-bottom:15px
}

#message{
  color:#ccc;
  line-height:1.7
}

#launch{
  display:none;
  margin-top:22px;
  padding:14px 25px;
  background:#16a34a;
  font-size:16px
}

#error{
  color:#ff8a8a;
  margin-top:14px;
  white-space:pre-wrap
}

@media(max-width:600px){
  #top{
    height:44px;
    padding:4px
  }

  button{
    font-size:11px;
    padding:7px 8px
  }
}
</style>

<script src="./scaffolding.js"></script>
</head>

<body>

<div id="app">

  <div id="top">
    <button id="start" disabled>▶ 開始</button>
    <button id="restart" disabled>↻ 再起動</button>
    <button id="full">⛶ 全画面</button>
  </div>

  <div id="stageWrap">

    <div id="project"></div>

    <div id="cover">
      <div id="panel">

        <div id="title">
          HYPER喰種RUSH
        </div>

        <div id="message">
          シミュレータを読み込み中…<br>
          初回は画像・音声が多いため少し時間がかかります。
        </div>

        <button id="launch">
          ▶ シミュレータ開始
        </button>

        <div id="error"></div>

      </div>
    </div>

  </div>
</div>

<script>
(async()=>{

  const q=s=>document.querySelector(s)

  const cover=q('#cover')
  const msg=q('#message')
  const launch=q('#launch')
  const err=q('#error')
  const start=q('#start')
  const restart=q('#restart')

  const fail=e=>{
    console.error(e)
    msg.textContent='読み込みに失敗しました'
    err.textContent=String(
      e&&(e.stack||e.message)||e
    )
  }

  try{

    const sc=new Scaffolding.Scaffolding()

    sc.width=480
    sc.height=360
    sc.resizeMode='preserve-ratio'
    sc.editableLists=false
    sc.shouldConnectPeripherals=true
    sc.usePackagedRuntime=false

    sc.setup()
    sc.appendTo(q('#project'))

    const storage=sc.storage

    storage.addWebStore(
      [
        storage.AssetType.ImageVector,
        storage.AssetType.ImageBitmap,
        storage.AssetType.Sound
      ],
      asset =>
        `./assets/${asset.assetId}.${asset.dataFormat}`
    )

    const response=await fetch(
      './project.json',
      {cache:'force-cache'}
    )

    if(!response.ok){
      throw new Error(
        'project.json HTTP '+response.status
      )
    }

    const data=await response.arrayBuffer()

    await sc.loadProject(data)

    msg.innerHTML=
      '準備完了！<br>下のボタンを押してください。'

    launch.style.display='inline-block'
    start.disabled=false
    restart.disabled=false

    const run=()=>{

      cover.style.display='none'

      try{
        sc.vm.runtime.audioEngine.audioContext.resume()
      }catch(e){}

      sc.greenFlag()

      try{
        sc.relayout()
      }catch(e){}
    }

    launch.onclick=run

    start.onclick=()=>{
      sc.greenFlag()
    }

    restart.onclick=()=>{

      try{
        sc.vm.stopAll()
      }catch(e){}

      setTimeout(
        ()=>sc.greenFlag(),
        80
      )
    }

    q('#full').onclick=async()=>{

      try{

        const el=q('#stageWrap')

        if(!document.fullscreenElement){
          await el.requestFullscreen()
        }else{
          await document.exitFullscreen()
        }

      }catch(e){}
    }

    window.addEventListener(
      'resize',
      ()=>{
        try{
          sc.relayout()
        }catch(e){}
      }
    )

  }catch(e){
    fail(e)
  }

})()
</script>

</body>
</html>
